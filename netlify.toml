[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/api/stations"
  to = "https://script.google.com/macros/s/AKfycbyUPXLErRCVsppYkzCeAuCNFoYPq_I8DqMI48pE5XOa_odGWhPOYZE5wOLZeqvohKfe/exec"
  status = 302
  force = true

[[redirects]]
  from = "/api/comments/:id"
  to = "https://gdebenz.ru/api/comments/:id"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
